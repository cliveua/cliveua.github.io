name: Update experience text

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update experience text and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = 'Over the past 12 years, I have been privileged to create digital experiences for various businesses,'
          new = 'Over the past <span id="experience-years"></span> years, I have been privileged to create digital experiences for various businesses,'
          if old in text:
              text = text.replace(old, new, 1)
              marker = '    <script type="text/javascript">\n'
              script = '''    <script type="text/javascript">\n        document.getElementById('experience-years').textContent = new Date().getFullYear() - 2011;\n\n'''
              text = text.replace(marker, script, 1)
              path.write_text(text)
          PY
          rm .github/workflows/update-experience.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-experience.yml
          git commit -m 'Auto-update years of experience from 2011'
          git push
