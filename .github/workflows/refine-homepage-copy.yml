name: Refine homepage copy

on:
  push:
    branches: [ master ]

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update homepage copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = {
              '''<p class="blurb blurb--line-1">I’m a <strong>Product Designer</strong> originally from Lagos, Nigeria, 
                  currently residing and working in Amsterdam, The Netherlands. I enjoy <strong>solving problems</strong>, and 
                  I'm intrigued by the process of connecting people's stories with brands through the medium of design.</p>''': '''<p class="blurb blurb--line-1">I’m a <strong>Product Designer and design leader</strong> based in Amsterdam. I work on complex products where business goals, technology, and people’s needs intersect. I enjoy turning <strong>ambiguity into simple, useful experiences</strong>.</p>''',
              '''<p class="blurb blurb--line-1">My goal is to create simple and effective user experiences from start to finish, 
                  informed by data but driven by empathy, with clarity as the top priority. 
                  I take great pleasure in helping businesses achieve their goals by <strong>creating experiences</strong> 
                  that are useful, usable, and ultimately used by people.</p>''': '''<p class="blurb blurb--line-1">For the past <span id="experience-years"></span> years, I’ve designed digital products and led teams across agencies, startups, and tech companies, from <strong>early-stage ideas to products used by billions of people</strong>.</p>''',
              '''<p class="blurb blurb--line-1">Over the past <span id="experience-years"></span> years, I have been privileged to create digital experiences for various businesses, 
                  serving as a product designer and <strong>leading teams</strong> in digital agencies, startups, and tech companies.</p>''': '',
              '''<p class="blurb blurb--line-1">After leading the team responsible for designing payment experiences for the world's largest accommodation platform, 
                  <strong>Booking.com</strong>, I have now joined <strong>Meta</strong>. Here, I'm working with the <strong>WhatsApp</strong> team to create simple, secure, and reliable 
                  communication experiences for over 2 billion people and businesses.</p>''': '''<p class="blurb blurb--line-1">I’ve led design for payment experiences at <strong>Booking.com</strong> and now work on <strong>WhatsApp at Meta</strong>, helping shape simple, secure communication experiences for more than 2 billion people and businesses.</p>'''
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine homepage copy"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/refine-homepage-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/refine-homepage-copy.yml
          git commit -m "Remove temporary copy workflow" || true
          git push || true
